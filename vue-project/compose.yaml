services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: appitsupply-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "3000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID}
    container_name: appitsupply-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-5173}:5173"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: appitsupply-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --url http://frontend:5173
    depends_on:
      - frontend